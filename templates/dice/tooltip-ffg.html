<div class="dice-tooltip">
  <div class="wrapper">
    {{#each parts}}
    <section class="tooltip-part">
      <div class="dice">
        <header class="part-header flexrow">
          <span class="part-formula">{{this.formula}}</span>
          {{#if this.flavor}}<span class="part-flavor">{{this.flavor}}</span>{{/if}}
          {{#if this.notFFG}}<span class="part-total">{{this.total}}</span>{{/if}}
        </header>
        <ol class="dice-rolls">
          {{#each this.rolls}}
          <li class="roll {{this.classes}}">{{{this.result}}}</li>
          {{/each}}
        </ol>
        {{#if this.symbols.length}}
        <div class="ffg-result-counts">
          {{#each this.symbols}}<span>{{{icon}}} {{value}}</span> {{/each}}
        </div>
        {{/if}}
      </div>
    </section>
    {{/each}}
  </div>
</div>

<nav class="sheet-tabs tabs" data-group="primary" style="{{#if (and (eq limited true) (eq displayLimited false)) }}display:none;{{/if}}">
  {{#each items}} {{#if (contains cls "V2")}}
  <a class="item {{#if isHiddenV2}}hidden-content{{/if}}" data-tab="{{tab}}" title="{{localize label}}" {{#if ../playerCharacter}}href="#{{tab}}" aria-label="{{localize label}}"{{/if}}><i class="{{icon}}" aria-hidden="true"></i></a>
  {{else}}
  <a class="item {{#if isHidden}}hidden-content{{/if}}" data-tab="{{tab}}" {{#if ../playerCharacter}}href="#{{tab}}"{{/if}}>{{localize label}}</a>
  {{/if}} {{/each}}
</nav>

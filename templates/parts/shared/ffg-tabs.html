<nav class="sheet-tabs tabs" data-group="primary" style="{{#if (and (eq limited true) (eq displayLimited false)) }}display:none;{{/if}}">
  {{#each items}}
    {{#if ../playerCharacter}}
      {{#if (contains cls "V2")}}
        <button type="button" class="item {{#if isHiddenV2}}hidden-content{{/if}}" data-tab="{{tab}}" title="{{localize label}}" aria-label="{{localize label}}"><i class="{{icon}}" aria-hidden="true"></i></button>
      {{else}}
        <button type="button" class="item {{#if isHidden}}hidden-content{{/if}}" data-tab="{{tab}}">{{localize label}}</button>
      {{/if}}
    {{else if (contains cls "V2")}}
      <a class="item {{#if isHiddenV2}}hidden-content{{/if}}" data-tab="{{tab}}" title="{{localize label}}"><i class="{{icon}}" aria-hidden="true"></i></a>
    {{else}}
      <a class="item {{#if isHidden}}hidden-content{{/if}}" data-tab="{{tab}}">{{localize label}}</a>
    {{/if}}
  {{/each}}
</nav>
